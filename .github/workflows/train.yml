name: Train Model

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      flavor_id:
        description: 'Selectel flavor ID (GPU)'
        default: 'c5293c19-4140-413f-89b9-23166842f7dd'  # 12vCPU, 120GB RAM, 1x RTX 4090 24GB
        required: true

env:
  REGION: ru-7
  AVAILABILITY_ZONE: ru-7b
  VOLUME_TYPE: 'universal.ru-7b'
  GPU_FLAVOR_ID: ${{ github.event.inputs.flavor_id || 'c5293c19-4140-413f-89b9-23166842f7dd' }}
  GPU_IMAGE_ID: '89450e2e-9f7c-4e7e-96cf-9187deafec7e'  # Ubuntu 24.04 LTS GPU Driver 580 Open
  GPU_NETWORK_ID: 'd0df791e-6044-46d1-a705-a7963beafb34'  # Москва ru-7
  GPU_KEYPAIR: 'OpenClaw'
  GPU_DISK_SIZE: '200'   # GB, boot volume (удаляется вместе с VM)
  VM_NAME: 'gpu-train-${{ github.run_id }}'
  MLFLOW_TRACKING_URI: 'http://192.168.0.239:5000'  # private network ru-7
  MINIO_ENDPOINT: 'http://192.168.0.239:9000'

jobs:
  train:
    runs-on: [self-hosted, linux, gpu-orchestrator]
    timeout-minutes: 480  # 8 часов max

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── 1. Поднять GPU VM ────────────────────────────────────────────────────
      - name: Create GPU VM
        id: create_vm
        env:
          SELECTEL_USER: ${{ secrets.SELECTEL_USER }}
          SELECTEL_PASSWORD: ${{ secrets.SELECTEL_PASSWORD }}
          SELECTEL_ACCOUNT_ID: ${{ secrets.SELECTEL_ACCOUNT_ID }}
          SELECTEL_PROJECT_ID: ${{ secrets.SELECTEL_PROJECT_ID }}
        run: |
          VM_ID=$(python3 /opt/projects/ds-expedition-infra/scripts/selectel_vm.py create \
            --name "${{ env.VM_NAME }}" \
            --flavor "${{ env.GPU_FLAVOR_ID }}" \
            --image "${{ env.GPU_IMAGE_ID }}" \
            --key "${{ env.GPU_KEYPAIR }}" \
            --network "${{ env.GPU_NETWORK_ID }}" \
            --disk-size "${{ env.GPU_DISK_SIZE }}" \
            --userdata /opt/projects/ds-expedition-infra/scripts/cloud-init-gpu.yaml)
          echo "vm_id=$VM_ID" >> $GITHUB_OUTPUT
          echo "GPU VM created: $VM_ID"

      - name: Wait for VM to be ACTIVE
        env:
          SELECTEL_USER: ${{ secrets.SELECTEL_USER }}
          SELECTEL_PASSWORD: ${{ secrets.SELECTEL_PASSWORD }}
          SELECTEL_ACCOUNT_ID: ${{ secrets.SELECTEL_ACCOUNT_ID }}
          SELECTEL_PROJECT_ID: ${{ secrets.SELECTEL_PROJECT_ID }}
        run: |
          python3 /opt/projects/ds-expedition-infra/scripts/selectel_vm.py wait \
            --id ${{ steps.create_vm.outputs.vm_id }}

      - name: Get VM IP
        id: get_ip
        env:
          SELECTEL_USER: ${{ secrets.SELECTEL_USER }}
          SELECTEL_PASSWORD: ${{ secrets.SELECTEL_PASSWORD }}
          SELECTEL_ACCOUNT_ID: ${{ secrets.SELECTEL_ACCOUNT_ID }}
          SELECTEL_PROJECT_ID: ${{ secrets.SELECTEL_PROJECT_ID }}
        run: |
          # Ждём cloud-init (~3 мин)
          sleep 180
          VM_IP=$(python3 /opt/projects/ds-expedition-infra/scripts/selectel_vm.py ip \
            --id ${{ steps.create_vm.outputs.vm_id }})
          echo "vm_ip=$VM_IP" >> $GITHUB_OUTPUT
          echo "VM IP: $VM_IP"

      # ── 2. Датасет доступен через NFS с main VM (192.168.0.239:/opt/datasets) ──
      # Монтирование происходит автоматически в cloud-init при старте GPU VM

      # ── 3. Запустить обучение ────────────────────────────────────────────────
      - name: Run training
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/selectel_ds_scan \
            mlops@${{ steps.get_ip.outputs.vm_ip }} \
            "cd /opt/project && \
             git clone ${{ github.server_url }}/${{ github.repository }} . && \
             git checkout ${{ github.sha }} && \
             source /opt/ml-env/bin/activate && \
             MLFLOW_TRACKING_URI=${{ env.MLFLOW_TRACKING_URI }} \
             MLFLOW_RUN_NAME=train-${{ github.ref_name }}-${{ github.run_id }} \
             python3 train.py \
               --dataset /opt/datasets \
               --output /opt/artifacts"

      # ── 4. Сохранить артефакты в MinIO ──────────────────────────────────────
      - name: Upload artifacts to MinIO
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/selectel_ds_scan \
            mlops@${{ steps.get_ip.outputs.vm_ip }} \
            "mc mirror /opt/artifacts/ minio/checkpoints/${{ github.ref_name }}/"

      # ── 5. Удалить GPU VM (всегда, даже при ошибке) ─────────────────────────
      - name: Delete GPU VM
        if: always()
        env:
          SELECTEL_USER: ${{ secrets.SELECTEL_USER }}
          SELECTEL_PASSWORD: ${{ secrets.SELECTEL_PASSWORD }}
          SELECTEL_ACCOUNT_ID: ${{ secrets.SELECTEL_ACCOUNT_ID }}
          SELECTEL_PROJECT_ID: ${{ secrets.SELECTEL_PROJECT_ID }}
        run: |
          python3 /opt/projects/ds-expedition-infra/scripts/selectel_vm.py delete \
            --id ${{ steps.create_vm.outputs.vm_id }}
          echo "GPU VM deleted ✅"

# TODO (Nick): Replace direct MinIO upload with DVC push
# Current: mc mirror /opt/artifacts/ minio/checkpoints/...
# Should be: dvc push (after DVC remote configured in project repo)
