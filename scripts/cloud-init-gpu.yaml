#cloud-config
# GPU VM cloud-init
# Базовый образ: Ubuntu 22.04 + GPU Driver 590 + Docker (уже встроено)
# Устанавливаем только Python 3.11 + ML зависимости

users:
  - name: mlops
    groups: [sudo, docker]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL

packages:
  - python3.11
  - python3.11-venv
  - python3-pip
  - git

runcmd:
  # NVIDIA Container Toolkit (если нет в образе)
  - nvidia-ctk runtime configure --runtime=docker || true
  - systemctl restart docker

  # MinIO client для синка датасета
  - curl -fsSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /usr/local/bin/mc
  - chmod +x /usr/local/bin/mc

  # Python venv + ML зависимости
  - python3.11 -m venv /opt/ml-env
  - /opt/ml-env/bin/pip install --upgrade pip --quiet
  - /opt/ml-env/bin/pip install --quiet torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu121
  - /opt/ml-env/bin/pip install --quiet mlflow boto3 rasterio geopandas shapely numpy pandas scikit-learn tqdm

  # Директории
  - mkdir -p /opt/datasets /opt/artifacts /opt/project
  - chown -R mlops:mlops /opt/datasets /opt/artifacts /opt/project /opt/ml-env

  # Сигнал готовности
  - touch /tmp/cloud-init-done
