#cloud-config
# GPU VM cloud-init для обучения
# Ubuntu 22.04 + CUDA 12 + Python 3.11 + project dependencies

users:
  - name: mlops
    groups: [sudo, docker]
    shell: /bin/bash
    ssh_authorized_keys:
      - ${SSH_PUBLIC_KEY}
    sudo: ALL=(ALL) NOPASSWD:ALL

packages:
  - python3.11
  - python3.11-venv
  - python3-pip
  - git
  - curl
  - awscli

runcmd:
  # Docker
  - curl -fsSL https://get.docker.com | sh
  - usermod -aG docker mlops

  # NVIDIA Container Toolkit
  - curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey | gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
  - curl -s -L https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list | sed 's#deb https://#deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://#g' > /etc/apt/sources.list.d/nvidia-container-toolkit.list
  - apt-get update -qq
  - apt-get install -y nvidia-container-toolkit
  - nvidia-ctk runtime configure --runtime=docker
  - systemctl restart docker

  # Python venv
  - python3.11 -m venv /opt/ml-env
  - /opt/ml-env/bin/pip install --upgrade pip
  - /opt/ml-env/bin/pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu121
  - /opt/ml-env/bin/pip install mlflow boto3 rasterio geopandas shapely numpy pandas scikit-learn tqdm

  # Директории
  - mkdir -p /opt/datasets /opt/artifacts /opt/project
  - chown -R mlops:mlops /opt/datasets /opt/artifacts /opt/project /opt/ml-env

  # Сигнал готовности
  - touch /tmp/cloud-init-done
