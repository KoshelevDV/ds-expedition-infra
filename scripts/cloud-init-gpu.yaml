#cloud-config
# GPU VM cloud-init
# Базовый образ: Ubuntu 24.04 LTS GPU Driver 580 Open

users:
  - name: mlops
    groups: [sudo]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL

packages:
  - python3.12
  - python3.12-venv
  - python3-pip
  - git
  - nfs-common

runcmd:
  # MinIO client
  - curl -fsSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /usr/local/bin/mc
  - chmod +x /usr/local/bin/mc

  # Python venv + ML зависимости
  - python3.12 -m venv /opt/ml-env
  - /opt/ml-env/bin/pip install --upgrade pip --quiet
  - /opt/ml-env/bin/pip install --quiet torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu121
  - /opt/ml-env/bin/pip install --quiet mlflow boto3 rasterio geopandas shapely numpy pandas scikit-learn tqdm

  # Директории
  - mkdir -p /opt/datasets /opt/artifacts /opt/project
  - chown -R mlops:mlops /opt/artifacts /opt/project /opt/ml-env

  # Монтируем датасет с main VM по NFS (private network 192.168.0.239)
  - mount -t nfs 192.168.0.239:/opt/datasets /opt/datasets
  - echo "192.168.0.239:/opt/datasets /opt/datasets nfs ro,defaults 0 0" >> /etc/fstab

  # Сигнал готовности
  - touch /tmp/cloud-init-done
